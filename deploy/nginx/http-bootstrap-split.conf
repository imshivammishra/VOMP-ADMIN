# HTTP bootstrap for the split-domain profile.
# Installed by deploy/scripts/enable-nginx.sh before certificates exist.
server {
    listen 80;
    listen [::]:80;

    server_name __FRONTEND_HOST__ __ADMIN_HOST__ __API_HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
