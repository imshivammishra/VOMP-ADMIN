name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: workspace-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify API and admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check API syntax and boot
        run: npm test

      - name: Lint admin console
        run: npm run lint --workspace @vomp/admin

      - name: Type-check admin console
        run: npm run typecheck --workspace @vomp/admin

      - name: Build admin console
        run: npm run build --workspace @vomp/admin
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: /
          API_INTERNAL_URL: http://127.0.0.1:3101
          NEXT_PUBLIC_SITE_URL: https://venueonmyplate.in
          CSP_UPGRADE_INSECURE_REQUESTS: "0"
